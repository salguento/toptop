<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Toptop — Gradient Lab</title>
        <style>
            :root {
                color-scheme: dark;
                font-family: Inter, ui-sans-serif, system-ui, sans-serif;
                background: #070711;
                color: #f8fafc;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background:
                    radial-gradient(circle at 20% 0%, #1e1b4b 0, transparent 32rem),
                    #070711;
            }

            header {
                position: sticky;
                z-index: 10;
                top: 0;
                padding: 1.25rem clamp(1rem, 4vw, 4rem);
                border-bottom: 1px solid rgb(255 255 255 / 10%);
                background: rgb(7 7 17 / 88%);
                backdrop-filter: blur(18px);
            }

            h1,
            p {
                margin: 0;
            }

            h1 {
                font-size: clamp(1.3rem, 3vw, 2rem);
            }

            .intro {
                margin-top: 0.35rem;
                color: #94a3b8;
                line-height: 1.5;
            }

            .controls {
                display: flex;
                flex-wrap: wrap;
                align-items: end;
                gap: 1rem;
                margin-top: 1rem;
            }

            label {
                display: grid;
                gap: 0.35rem;
                color: #cbd5e1;
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            select,
            button {
                min-height: 2.6rem;
                border: 1px solid rgb(255 255 255 / 14%);
                border-radius: 0.75rem;
                background: #17172a;
                color: #f8fafc;
                font: inherit;
            }

            select {
                min-width: min(20rem, 82vw);
                padding: 0 0.85rem;
            }

            .count-buttons {
                display: flex;
                gap: 0.4rem;
            }

            button {
                width: 2.8rem;
                cursor: pointer;
                font-weight: 800;
            }

            button[aria-pressed="true"] {
                border-color: #a78bfa;
                background: #6d28d9;
            }

            .palette-info {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 0.5rem;
                margin-top: 1rem;
                color: #cbd5e1;
                font-size: 0.82rem;
            }

            .swatch {
                width: 1.35rem;
                height: 1.35rem;
                border: 1px solid rgb(255 255 255 / 28%);
                border-radius: 999px;
            }

            main {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr));
                gap: clamp(1rem, 2.5vw, 2rem);
                padding: clamp(1rem, 4vw, 4rem);
            }

            article {
                overflow: hidden;
                border: 1px solid rgb(255 255 255 / 10%);
                border-radius: 1.1rem;
                background: #11111f;
                box-shadow: 0 24px 60px rgb(0 0 0 / 28%);
            }

            .artwork {
                position: relative;
                aspect-ratio: 9 / 16;
                overflow: hidden;
                background-color: #111827;
                background-size: cover;
            }

            .artwork::after {
                position: absolute;
                inset: 0;
                border: 1px solid rgb(255 255 255 / 10%);
                content: "";
                pointer-events: none;
            }

            .sample-content {
                position: absolute;
                inset: 0;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 1.25rem;
                text-shadow: 0 1px 10px rgb(0 0 0 / 20%);
            }

            .sample-content strong {
                font-size: 1.35rem;
                letter-spacing: -0.04em;
            }

            .sample-content span {
                max-width: 10rem;
                font-size: 0.78rem;
                font-weight: 700;
                line-height: 1.25;
                opacity: 0.9;
            }

            footer {
                padding: 0.9rem 1rem 1rem;
            }

            footer h2 {
                margin: 0;
                font-size: 0.95rem;
            }

            footer p {
                margin-top: 0.3rem;
                color: #94a3b8;
                font-size: 0.78rem;
                line-height: 1.4;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Toptop Gradient Lab</h1>
            <p class="intro">
                Compare G01–G15 em cinco paletas simuladas e nas quatro faixas de quantidade de cores.
            </p>

            <div class="controls">
                <label>
                    Paleta simulada
                    <select id="palette-select"></select>
                </label>

                <label>
                    Quantidade de cores
                    <span class="count-buttons" id="count-buttons"></span>
                </label>
            </div>

            <div class="palette-info" id="palette-info"></div>
        </header>

        <main id="gradient-grid"></main>

        <script>
            const PALETTES = [
                {
                    name: "P01 — Tropical noturna",
                    colors: ["#42d6ff", "#ff4fa3", "#8b5cf6", "#ffad33", "#15d6a2"],
                },
                {
                    name: "P02 — Pôr do sol analógico",
                    colors: ["#f4a261", "#e76f51", "#264653", "#2a9d8f", "#e9c46a"],
                },
                {
                    name: "P03 — Orquídea elétrica",
                    colors: ["#b8c0ff", "#ff70a6", "#70d6ff", "#ff9770", "#ffd670"],
                },
                {
                    name: "P04 — Vinil botânico",
                    colors: ["#84a98c", "#2f3e46", "#cad2c5", "#bc6c25", "#dda15e"],
                },
                {
                    name: "P05 — Contraste editorial",
                    colors: ["#b2cada", "#c78032", "#074e8e", "#b43f6b", "#3a9d83"],
                },
            ];

            const WEIGHTS = {
                2: [0.5, 0.5],
                3: [0.5, 0.3, 0.2],
                4: [0.5, 0.25, 0.15, 0.1],
                5: [0.5, 0.2, 0.15, 0.1, 0.05],
            };

            const rgba = (hex, alpha) => {
                if (!hex) return "transparent";
                const value = Number.parseInt(hex.slice(1), 16);
                return `rgb(${(value >> 16) & 255} ${(value >> 8) & 255} ${value & 255} / ${alpha})`;
            };

            const prepare = (colors, weights) => {
                const padded = Array.from({ length: 5 }, (_, index) => colors[index] ?? null);
                const paddedWeights = Array.from({ length: 5 }, (_, index) => weights[index] ?? 0);
                return { colors: padded, weights: paddedWeights };
            };

            const SMOOTH_STOP_POSITIONS = {
                2: [0, 100],
                3: [40, 60, 100],
                4: [35, 65, 85, 95],
                5: [40, 60, 80, 90, 100],
            };

            const softStops = (colors) => {
                const positions = SMOOTH_STOP_POSITIONS[colors.length];
                const stops = [`${colors[0]} 0%`];

                colors.forEach((color, index) => {
                    stops.push(`${color} ${positions[index]}%`);
                });

                stops.push(`${colors.at(-1)} 100%`);
                return stops.join(", ");
            };

            const baseLinear = (angle, colors, weights) =>
                `linear-gradient(${angle}, ${softStops(colors, weights)})`;

            const baseConic = (angle, position, colors, weights) =>
                `conic-gradient(from ${angle} at ${position}, ${softStops(colors, weights)})`;

            const strength = (weight, minimum = 0.16) =>
                Math.min(0.72, minimum + weight * 0.78).toFixed(2);

            const GRADIENTS = [
                {
                    id: "G01",
                    name: "Diamond Aurora",
                    description: "Aurora facetada em um diamante central.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `radial-gradient(circle at 50% 42%, rgb(255 255 255 / 22%) 0 2%, transparent 24%)`,
                            `linear-gradient(45deg, transparent 0 36%, ${rgba(c[4], strength(w[4], 0))} 49%, transparent 62%)`,
                            `linear-gradient(-45deg, transparent 0 36%, ${rgba(c[3], strength(w[3], 0))} 49%, transparent 62%)`,
                            `conic-gradient(from 45deg at 50% 42%, ${rgba(c[0], strength(w[0]))} 0%, ${rgba(c[1], strength(w[1], 0))} 25%, ${rgba(c[2], strength(w[2], 0))} 50%, ${rgba(c[3], strength(w[3], 0))} 75%, ${rgba(c[0], strength(w[0]))} 100%)`,
                            baseConic("-18deg", "50% 42%", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G02",
                    name: "Liquid Mesh",
                    description: "Malha líquida com núcleos sobrepostos.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `radial-gradient(circle at 18% 22%, ${rgba(c[0], strength(w[0]))} 0 10%, transparent 42%)`,
                            `radial-gradient(circle at 82% 18%, ${rgba(c[1], strength(w[1]))} 0 8%, transparent 40%)`,
                            `radial-gradient(circle at 74% 78%, ${rgba(c[2], strength(w[2]))} 0 7%, transparent 43%)`,
                            `radial-gradient(circle at 22% 82%, ${rgba(c[3], strength(w[3]))} 0 6%, transparent 38%)`,
                            `radial-gradient(circle at 52% 48%, ${rgba(c[4], strength(w[4]))}, transparent 36%)`,
                            baseLinear("160deg", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G03",
                    name: "Iridescent Aperture",
                    description: "Abertura iridescente com profundidade radial.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `radial-gradient(circle at 62% 38%, rgb(255 255 255 / 24%) 0%, transparent 3% 12%, rgb(0 0 0 / 18%) 20%, transparent 36%)`,
                            `radial-gradient(ellipse 86% 58% at 62% 38%, transparent 12%, ${rgba(c[0], strength(w[0]))} 36%, ${rgba(c[1], strength(w[1], 0))} 58%, transparent 82%)`,
                            `conic-gradient(from -48deg at 62% 38%, ${rgba(c[0], 0.58)} 0deg, ${rgba(c[1], 0.48)} 78deg, ${rgba(c[2], 0.38)} 154deg, ${rgba(c[3], 0.3)} 228deg, ${rgba(c[4], 0.24)} 302deg, ${rgba(c[0], 0.58)} 360deg)`,
                            baseLinear("156deg", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G04",
                    name: "Prismatic Fold",
                    description: "Dobras de luz e planos diagonais.",
                    build: (input) => {
                        const { colors: c } = prepare(input.colors, input.weights);
                        return [
                            `linear-gradient(118deg, transparent 0 18%, ${rgba(c[1], 0.5)} 28%, transparent 38% 100%)`,
                            `linear-gradient(64deg, transparent 0 38%, ${rgba(c[2], 0.42)} 48%, transparent 58% 100%)`,
                            `linear-gradient(152deg, transparent 0 55%, ${rgba(c[3], 0.34)} 66%, transparent 78% 100%)`,
                            `linear-gradient(25deg, rgb(255 255 255 / 9%), transparent 28% 74%, rgb(0 0 0 / 12%))`,
                            baseLinear("132deg", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G05",
                    name: "Kaleidoscope Bloom",
                    description: "Rosácea cônica com órbitas caleidoscópicas.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `radial-gradient(circle at 50% 46%, rgb(255 255 255 / 24%) 0 1.5%, transparent 7% 15%, ${rgba(c[4], strength(w[4], 0))} 16% 18%, transparent 19% 29%, ${rgba(c[2], strength(w[2], 0))} 30% 33%, transparent 34% 47%, ${rgba(c[1], strength(w[1], 0))} 48% 51%, transparent 52%)`,
                            `repeating-conic-gradient(from 12deg at 50% 46%, transparent 0 10deg, ${rgba(c[0], 0.28)} 11deg 18deg, transparent 19deg 36deg)`,
                            `radial-gradient(ellipse 88% 58% at 50% 46%, ${rgba(c[0], strength(w[0]))}, transparent 72%)`,
                            baseConic("55deg", "50% 46%", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G06",
                    name: "Chromatic Monolith",
                    description: "Monólito vertical cortado por um núcleo em diamante.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `linear-gradient(45deg, transparent 0 41%, rgb(255 255 255 / 13%) 49%, transparent 57%)`,
                            `linear-gradient(-45deg, transparent 0 41%, ${rgba(c[2], strength(w[2], 0))} 49%, transparent 57%)`,
                            `linear-gradient(90deg, ${rgba(c[1], 0.52)} 0 14%, transparent 29% 71%, ${rgba(c[3], 0.42)} 86% 100%)`,
                            `radial-gradient(ellipse 38% 58% at 50% 48%, ${rgba(c[0], strength(w[0]))} 0 12%, transparent 68%)`,
                            baseLinear("172deg", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G07",
                    name: "Chromatic Eclipse",
                    description: "Eclipse cromático cercado por uma coroa suave.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `radial-gradient(circle at 50% 42%, rgb(3 4 12 / 78%) 0 8%, ${rgba(c[0], strength(w[0]))} 17%, ${rgba(c[1], strength(w[1], 0))} 31%, transparent 57%)`,
                            `conic-gradient(from 18deg at 50% 42%, transparent 0%, ${rgba(c[2], 0.34)} 12%, transparent 27%, ${rgba(c[3], 0.28)} 43%, transparent 59%, ${rgba(c[4], 0.24)} 76%, transparent 91% 100%)`,
                            `radial-gradient(ellipse 112% 72% at 50% 42%, ${rgba(c[0], 0.2)}, transparent 72%)`,
                            baseConic("90deg", "50% 42%", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G08",
                    name: "Chromatic Current",
                    description: "Duas correntes cromáticas fluidas em diagonal.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `conic-gradient(from 202deg at -8% 108%, transparent 0%, ${rgba(c[0], strength(w[0]))} 14%, ${rgba(c[1], strength(w[1], 0))} 27%, transparent 48%)`,
                            `conic-gradient(from 22deg at 108% -8%, transparent 0%, ${rgba(c[2], strength(w[2], 0))} 16%, ${rgba(c[3], strength(w[3], 0))} 31%, transparent 52%)`,
                            `radial-gradient(ellipse 150% 34% at 50% 52%, transparent 12%, rgb(255 255 255 / 15%) 48%, transparent 78%)`,
                            `linear-gradient(128deg, ${rgba(c[4], strength(w[4], 0))}, transparent 28% 72%, ${rgba(c[1], 0.22)})`,
                            baseLinear("128deg", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G09",
                    name: "Moiré Prism",
                    description: "Interferência moiré entre anéis e raios prismáticos.",
                    build: (input) => {
                        const { colors: c } = prepare(input.colors, input.weights);
                        return [
                            `repeating-radial-gradient(ellipse at 36% 44%, transparent 0 3.5%, ${rgba(c[1], 0.19)} 3.8% 4.4%, transparent 4.7% 8.5%)`,
                            `repeating-conic-gradient(from 7deg at 64% 54%, transparent 0 5deg, ${rgba(c[2], 0.16)} 6deg 8deg, transparent 9deg 17deg)`,
                            `radial-gradient(ellipse 88% 62% at 50% 50%, transparent 16%, rgb(0 0 0 / 24%) 100%)`,
                            baseConic("-40deg", "50% 50%", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G10",
                    name: "Diamond Quilt",
                    description: "Mosaico de diamantes e triângulos sobrepostos.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `conic-gradient(from 45deg at 25% 24%, ${rgba(c[0], strength(w[0]))} 0%, transparent 24%, ${rgba(c[2], strength(w[2], 0))} 52%, transparent 78%, ${rgba(c[0], strength(w[0]))} 100%)`,
                            `conic-gradient(from 225deg at 76% 76%, ${rgba(c[1], strength(w[1], 0))} 0%, transparent 24%, ${rgba(c[3], strength(w[3], 0))} 52%, transparent 78%, ${rgba(c[1], strength(w[1], 0))} 100%)`,
                            `linear-gradient(45deg, transparent 0 47%, rgb(255 255 255 / 14%) 49% 51%, transparent 53%)`,
                            `linear-gradient(-45deg, transparent 0 47%, rgb(0 0 0 / 16%) 49% 51%, transparent 53%)`,
                            baseConic("45deg", "50% 50%", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G11",
                    name: "Silk Caustics",
                    description: "Reflexos de seda cruzando um campo cromático.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `linear-gradient(112deg, transparent 0%, ${rgba(c[1], strength(w[1], 0))} 28%, transparent 56%)`,
                            `linear-gradient(68deg, transparent 18%, ${rgba(c[2], strength(w[2], 0))} 48%, transparent 78%)`,
                            `radial-gradient(ellipse 110% 38% at 52% 34%, rgb(255 255 255 / 17%) 0%, transparent 72%)`,
                            `radial-gradient(ellipse 76% 92% at 18% 82%, ${rgba(c[3], strength(w[3], 0))}, transparent 74%)`,
                            baseLinear("152deg", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G12",
                    name: "Magnetic Field",
                    description: "Campo magnético com linhas em torção.",
                    build: (input) => {
                        const { colors: c } = prepare(input.colors, input.weights);
                        return [
                            `repeating-conic-gradient(from 20deg at 50% 54%, transparent 0 7deg, ${rgba(c[3], 0.18)} 8deg 10deg, transparent 11deg 21deg)`,
                            `radial-gradient(ellipse 62% 38% at 50% 54%, transparent 0 22%, ${rgba(c[0], 0.52)} 58%, transparent 74%)`,
                            baseConic("80deg", "50% 54%", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G13",
                    name: "Diamond Haze",
                    description: "Diamante difuso envolvido por névoa cromática.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `linear-gradient(45deg, transparent 8%, ${rgba(c[1], strength(w[1], 0))} 48%, transparent 88%)`,
                            `linear-gradient(-45deg, transparent 8%, ${rgba(c[2], strength(w[2], 0))} 48%, transparent 88%)`,
                            `radial-gradient(ellipse 54% 38% at 50% 48%, rgb(255 255 255 / 20%) 0%, transparent 74%)`,
                            `radial-gradient(ellipse 86% 66% at 50% 48%, ${rgba(c[0], strength(w[0]))} 0%, ${rgba(c[3], strength(w[3], 0))} 54%, transparent 82%)`,
                            baseConic("45deg", "50% 48%", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G14",
                    name: "Gravity Wells",
                    description: "Dois poços gravitacionais com halos fluidos.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `radial-gradient(circle at 22% 32%, rgb(2 3 10 / 62%) 0 5%, ${rgba(c[0], strength(w[0]))} 16%, ${rgba(c[2], strength(w[2], 0))} 34%, transparent 58%)`,
                            `radial-gradient(circle at 78% 70%, rgb(2 3 10 / 58%) 0 6%, ${rgba(c[1], strength(w[1], 0))} 18%, ${rgba(c[3], strength(w[3], 0))} 37%, transparent 62%)`,
                            `conic-gradient(from 35deg at 22% 32%, transparent 0deg, ${rgba(c[0], 0.36)} 72deg, transparent 148deg, ${rgba(c[2], 0.28)} 228deg, transparent 310deg 360deg)`,
                            `conic-gradient(from 215deg at 78% 70%, transparent 0deg, ${rgba(c[1], 0.34)} 76deg, transparent 154deg, ${rgba(c[4], 0.24)} 236deg, transparent 318deg 360deg)`,
                            baseLinear("138deg", input.colors, input.weights),
                        ].join(",");
                    },
                },
                {
                    id: "G15",
                    name: "Diamond Bloom",
                    description: "Flor geométrica composta por pétalas e facetas.",
                    build: (input) => {
                        const { colors: c, weights: w } = prepare(input.colors, input.weights);
                        return [
                            `radial-gradient(ellipse 26% 58% at 50% 16%, ${rgba(c[1], strength(w[1], 0))}, transparent 72%)`,
                            `radial-gradient(ellipse 26% 58% at 84% 50%, ${rgba(c[2], strength(w[2], 0))}, transparent 72%)`,
                            `radial-gradient(ellipse 26% 58% at 50% 84%, ${rgba(c[3], strength(w[3], 0))}, transparent 72%)`,
                            `radial-gradient(ellipse 26% 58% at 16% 50%, ${rgba(c[4], strength(w[4], 0))}, transparent 72%)`,
                            `conic-gradient(from 45deg at 50% 50%, ${rgba(c[0], strength(w[0]))} 0%, ${rgba(c[1], strength(w[1], 0))} 25%, ${rgba(c[2], strength(w[2], 0))} 50%, ${rgba(c[3], strength(w[3], 0))} 75%, ${rgba(c[0], strength(w[0]))} 100%)`,
                            `radial-gradient(circle at 50% 50%, rgb(255 255 255 / 20%) 0 2%, transparent 24%)`,
                            baseConic("12deg", "50% 50%", input.colors, input.weights),
                        ].join(",");
                    },
                },
            ];

            const luminance = (hex) => {
                const value = Number.parseInt(hex.slice(1), 16);
                const channels = [(value >> 16) & 255, (value >> 8) & 255, value & 255].map((channel) => {
                    const normalized = channel / 255;
                    return normalized <= 0.04045
                        ? normalized / 12.92
                        : ((normalized + 0.055) / 1.055) ** 2.4;
                });
                return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
            };

            const contrastRatio = (first, second) =>
                (Math.max(first, second) + 0.05) / (Math.min(first, second) + 0.05);

            const textColor = (colors, weights) => {
                const luminances = colors.map(luminance);
                const blackRatios = luminances.map((color) => contrastRatio(color, 0));
                const whiteRatios = luminances.map((color) => contrastRatio(color, 1));
                const weightedBlack = blackRatios.reduce(
                    (total, ratio, index) => total + ratio * weights[index],
                    0,
                );
                const weightedWhite = whiteRatios.reduce(
                    (total, ratio, index) => total + ratio * weights[index],
                    0,
                );
                const blackScore = weightedBlack * 0.8 + Math.min(...blackRatios) * 0.2;
                const whiteScore = weightedWhite * 0.8 + Math.min(...whiteRatios) * 0.2;

                return blackScore > whiteScore ? "#000000" : "#ffffff";
            };

            const paletteSelect = document.querySelector("#palette-select");
            const countButtons = document.querySelector("#count-buttons");
            const paletteInfo = document.querySelector("#palette-info");
            const grid = document.querySelector("#gradient-grid");
            let selectedPalette = 0;
            let selectedCount = 4;

            PALETTES.forEach((palette, index) => {
                const option = document.createElement("option");
                option.value = String(index);
                option.textContent = palette.name;
                paletteSelect.append(option);
            });

            [2, 3, 4, 5].forEach((count) => {
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = String(count);
                button.dataset.count = String(count);
                button.addEventListener("click", () => {
                    selectedCount = count;
                    render();
                });
                countButtons.append(button);
            });

            paletteSelect.addEventListener("change", (event) => {
                selectedPalette = Number(event.target.value);
                render();
            });

            const render = () => {
                const palette = PALETTES[selectedPalette];
                const colors = palette.colors.slice(0, selectedCount);
                const weights = WEIGHTS[selectedCount];
                const foreground = textColor(colors, weights);

                countButtons.querySelectorAll("button").forEach((button) => {
                    button.setAttribute(
                        "aria-pressed",
                        String(Number(button.dataset.count) === selectedCount),
                    );
                });

                paletteInfo.replaceChildren();
                colors.forEach((color, index) => {
                    const swatch = document.createElement("span");
                    swatch.className = "swatch";
                    swatch.style.background = color;
                    swatch.title = `${color} — ${weights[index] * 100}%`;
                    paletteInfo.append(swatch, `${weights[index] * 100}%`);
                });
                paletteInfo.append(` · texto sugerido ${foreground}`);

                grid.replaceChildren();
                GRADIENTS.forEach((gradient) => {
                    const article = document.createElement("article");
                    const artwork = document.createElement("div");
                    const sample = document.createElement("div");
                    const footer = document.createElement("footer");
                    const title = document.createElement("h2");
                    const description = document.createElement("p");

                    artwork.className = "artwork";
                    artwork.style.backgroundImage = gradient.build({ colors, weights });
                    sample.className = "sample-content";
                    sample.style.color = foreground;
                    sample.innerHTML = `<strong>${gradient.id}</strong><span>TOPTOP · ${selectedCount} CORES<br>${palette.name.replace(/^P\d+ — /, "")}</span>`;
                    title.textContent = `${gradient.id} — ${gradient.name}`;
                    description.textContent = gradient.description;

                    artwork.append(sample);
                    footer.append(title, description);
                    article.append(artwork, footer);
                    grid.append(article);
                });
            };

            render();
        </script>
    </body>
</html>
